<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="800" height="170" role="img" aria-label="Technical toolkit" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t{font:700 16px Arial,Helvetica,sans-serif;fill:#ffffff}
    .s{font:400 13px Arial,Helvetica,sans-serif;fill:#ffffff}
  </style>
  <rect width="800" height="170" rx="14" fill="#771be2"/>
  <rect width="800" height="170" rx="14" fill="none" stroke="#f5d700" stroke-width="2"/>
  <!-- barra: larghezza 740 = 100% ; x iniziale 30 -->
  <clipPath id="c"><rect x="30" y="28" width="740" height="26" rx="13"/></clipPath>
  <g clip-path="url(#c)">
    <rect x="30"     y="28" width="355.2" height="26" fill="#f5d700"/>
    <rect x="385.2"  y="28" width="118.4" height="26" fill="#ffffff"/>
    <rect x="503.6"  y="28" width="103.6" height="26" fill="#c9a2fa"/>
    <rect x="607.2"  y="28" width="66.6"  height="26" fill="#fbe86a"/>
    <rect x="673.8"  y="28" width="44.4"  height="26" fill="#3d0b80"/>
    <rect x="718.2"  y="28" width="51.8"  height="26" fill="#9d57ee"/>
  </g>
  <g>
    <rect x="30"  y="86" width="14" height="14" rx="3" fill="#f5d700"/><text class="t" x="52"  y="98">PHP</text><text class="s" x="52"  y="120">48% of public code</text>
    <rect x="176" y="86" width="14" height="14" rx="3" fill="#ffffff"/><text class="t" x="198" y="98">Blade</text><text class="s" x="198" y="120">16% of public code</text>
    <rect x="322" y="86" width="14" height="14" rx="3" fill="#c9a2fa"/><text class="t" x="344" y="98">JavaScript</text><text class="s" x="344" y="120">14% of public code</text>
    <rect x="468" y="86" width="14" height="14" rx="3" fill="#fbe86a"/><text class="t" x="490" y="98">HTML</text><text class="s" x="490" y="120">9% of public code</text>
    <rect x="614" y="86" width="14" height="14" rx="3" fill="#3d0b80" stroke="#ffffff" stroke-width="1"/><text class="t" x="636" y="98">Vue</text><text class="s" x="636" y="120">6% of public code</text>
  </g>
