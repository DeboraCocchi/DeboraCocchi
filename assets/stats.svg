<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="800" height="140" role="img" aria-label="Proof at a glance" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .n{font:700 44px Arial,Helvetica,sans-serif;fill:#f5d700}
    .l{font:600 15px Arial,Helvetica,sans-serif;fill:#ffffff;letter-spacing:1px}
  </style>
  <rect x="0" y="0" width="800" height="140" rx="14" fill="#771be2"/>
  <rect x="0" y="126" width="800" height="14" rx="0" fill="#f5d700"/>
  <rect x="0" y="0" width="800" height="140" rx="14" fill="none" stroke="#f5d700" stroke-width="2"/>
  <g text-anchor="middle">
    <text class="n" x="100" y="70">66</text><text class="l" x="100" y="100">REPOSITORIES</text>
